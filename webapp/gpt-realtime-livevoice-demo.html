<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Azure OpenAI リアルタイム WebRTC デモ</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
    h1 { margin-bottom: 8px; }
    .row { margin: 10px 0; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input, textarea, select, button {
      width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px;
    }
    textarea { min-height: 84px; resize: vertical; }
    .btns { display: flex; gap: 10px; }
    .btns button { width: auto; min-width: 120px; }
    #status { padding: 10px; background: #f4f4f4; border-radius: 6px; margin: 12px 0; }
    #events {
      white-space: pre-wrap; background: #111; color: #d2f8d2; padding: 12px;
      border-radius: 6px; min-height: 180px; overflow: auto;
    }
  </style>
</head>
<body>
  <h1>Azure OpenAI リアルタイム WebRTC デモ</h1>
  <p>「リアルタイム会話を開始」を選択すると、Function から一時トークンを取得し、Realtime WebRTC エンドポイントに接続します。</p>

  <div class="row">
    <label for="functionUrl">Function API URL</label>
    <input id="functionUrl" value="http://localhost:7071/api/realtime-access" />
  </div>

  <div class="row">
    <label for="functionKey">Function Key（ローカル実行時は空欄可）</label>
    <input id="functionKey" placeholder="Azure へのデプロイ後に Function Key を入力" />
  </div>

  <div class="row">
    <label for="voice">Voice</label>
    <select id="voice">
      <option value="alloy">alloy</option>
      <option value="verse">verse</option>
      <option value="sage">sage</option>
      <option value="ash">ash</option>
    </select>
  </div>

  <div class="row">
    <label for="instructions">システム指示（任意）</label>
    <textarea id="instructions">日本語で簡潔かつ自然に回答してください。</textarea>
  </div>

  <div class="btns">
    <button id="startBtn">リアルタイム会話を開始</button>
    <button id="stopBtn" disabled>停止</button>
  </div>

  <div id="status">状態：未接続</div>
  <audio id="remoteAudio" autoplay playsinline controls></audio>
  <div id="events"></div>

  <script>
    const statusEl = document.getElementById("status");
    const eventsEl = document.getElementById("events");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const remoteAudio = document.getElementById("remoteAudio");
    const functionUrlEl = document.getElementById("functionUrl");
    const functionKeyEl = document.getElementById("functionKey");
    const voiceEl = document.getElementById("voice");
    const instructionsEl = document.getElementById("instructions");

    let pc = null;
    let localStream = null;
    let remoteStream = null;
    let dc = null;

    function setStatus(msg) {
      statusEl.textContent = `状態：${msg}`;
    }

    function log(msg, obj) {
      let line = `[${new Date().toLocaleTimeString()}] ${msg}`;
      if (obj !== undefined) {
        try {
          line += `\n${typeof obj === "string" ? obj : JSON.stringify(obj, null, 2)}`;
        } catch {
          line += `\n${String(obj)}`;
        }
      }
      eventsEl.textContent += `${line}\n\n`;
      eventsEl.scrollTop = eventsEl.scrollHeight;
    }

    async function getEphemeralSession() {
      const baseUrl = functionUrlEl.value.trim();
      if (!baseUrl) {
        throw new Error("Function API URL を入力してください。");
      }

      const key = functionKeyEl.value.trim();
      const separator = baseUrl.includes("?") ? "&" : "?";
      const functionUrl = key
        ? `${baseUrl}${separator}code=${encodeURIComponent(key)}`
        : baseUrl;

      const resp = await fetch(functionUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          voice: voiceEl.value,
          instructions: instructionsEl.value
        })
      });

      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(`Function の呼び出しに失敗しました: ${JSON.stringify(data)}`);
      }

      const token = data.ephemeral_token || data?.session?.client_secret?.value;
      if (!token || !data.webrtc_url) {
        throw new Error(`Function の応答に必要なフィールドがありません: ${JSON.stringify(data)}`);
      }
      return { token, webrtcUrl: data.webrtc_url, raw: data };
    }

    async function start() {
      startBtn.disabled = true;
      try {
        setStatus("一時トークンを取得中...");
        const session = await getEphemeralSession();
        log("セッションを取得しました", session.raw);

        setStatus("マイクの使用許可を確認中...");
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        setStatus("WebRTC 接続を確立中...");
        pc = new RTCPeerConnection();
        pc.onconnectionstatechange = () => setStatus(`WebRTC: ${pc.connectionState}`);
        pc.oniceconnectionstatechange = () => log("ICE の状態", pc.iceConnectionState);
        remoteStream = new MediaStream();
        remoteAudio.srcObject = remoteStream;
        remoteAudio.muted = false;
        remoteAudio.volume = 1;
        pc.ontrack = (event) => {
          log("リモート音声トラックを受信しました", {
            kind: event.track.kind,
            muted: event.track.muted,
            streams: event.streams.length
          });

          if (event.streams[0]) {
            remoteAudio.srcObject = event.streams[0];
          } else {
            remoteStream.addTrack(event.track);
          }

          const playAudio = async () => {
            try {
              await remoteAudio.play();
              log("リモート音声の再生を開始しました");
            } catch (err) {
              log("ブラウザーにより自動再生がブロックされました。音声コントロールの再生ボタンを選択してください", err?.message);
            }
          };

          event.track.addEventListener("unmute", playAudio, { once: true });
          void playAudio();
        };

        for (const track of localStream.getTracks()) {
          pc.addTrack(track, localStream);
        }

        dc = pc.createDataChannel("oai-events");
        dc.onerror = (event) => log("データチャネルでエラーが発生しました", event);
        dc.onclose = () => log("データチャネルが閉じられました");
        dc.onopen = () => {
          log("データチャネルが開きました");
          dc.send(JSON.stringify({
            type: "response.create",
            response: {
              instructions: "こんにちは。日本語で簡単に自己紹介してください。"
            }
          }));
        };
        dc.onmessage = (e) => {
          try {
            log("Realtime イベント", JSON.parse(e.data));
          } catch {
            log("Realtime の未処理メッセージ", e.data);
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        const sdpResp = await fetch(session.webrtcUrl, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${session.token}`,
            "Content-Type": "application/sdp"
          },
          body: offer.sdp
        });

        if (!sdpResp.ok) {
          throw new Error(`Realtime SDP の交換に失敗しました: ${await sdpResp.text()}`);
        }

        const answerSdp = await sdpResp.text();
        await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

        stopBtn.disabled = false;
        setStatus("接続しました。会話を開始できます");
      } catch (err) {
        log("開始に失敗しました", err?.message || String(err));
        setStatus("開始に失敗しました");
        await stop();
      } finally {
        startBtn.disabled = false;
      }
    }

    async function stop() {
      if (dc) {
        try { dc.close(); } catch {}
        dc = null;
      }
      if (pc) {
        try { pc.close(); } catch {}
        pc = null;
      }
      if (localStream) {
        for (const t of localStream.getTracks()) {
          t.stop();
        }
        localStream = null;
      }
      remoteAudio.srcObject = null;
      remoteStream = null;
      stopBtn.disabled = true;
      setStatus("切断しました");
    }

    startBtn.addEventListener("click", start);
    stopBtn.addEventListener("click", () => { void stop(); });
  </script>
</body>
</html>
