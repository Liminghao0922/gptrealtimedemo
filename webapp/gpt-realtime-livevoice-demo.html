<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Azure OpenAI リアルタイム WebRTC デモ</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
    h1 { margin-bottom: 8px; }
    .row { margin: 10px 0; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input, textarea, select, button {
      width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px;
    }
    textarea { min-height: 84px; resize: vertical; }
    .btns { display: flex; gap: 10px; }
    .btns button { width: auto; min-width: 120px; }
    #status { padding: 10px; background: #f4f4f4; border-radius: 6px; margin: 12px 0; }
    #events {
      white-space: pre-wrap; background: #111; color: #d2f8d2; padding: 12px;
      border-radius: 6px; min-height: 180px; overflow: auto;
    }
  </style>
</head>
<body>
  <h1>Azure OpenAI リアルタイム WebRTC デモ</h1>
  <p>「リアルタイム会話を開始」を選択すると、同じホストのアクセス API から一時トークンを取得し、Realtime WebRTC エンドポイントに接続します。</p>
  <p>ブラウザーは client_secrets が発行する短期トークンを使用します。Entra 認証はバックエンドのみです。</p>

  <div class="row">
    <label for="functionUrl">アクセス API URL（通常は変更不要）</label>
    <input id="functionUrl" value="/api/realtime-access" />
  </div>

  <div class="row">
    <label for="demoKey">Demo キー（同一オリジン専用）</label>
    <input id="demoKey" type="password" autocomplete="off" placeholder="管理者から共有された Demo キー" />
  </div>
  <details>
    <summary>外部 Azure Function を使用する場合</summary>
    <p>アクセス API URL を変更し、送信先を確認して専用 Function キーを入力してください。Demo キーは外部に送信しません。</p>
    <label for="functionKey">外部 Function キー（指定 URL にのみ送信）</label>
    <input id="functionKey" type="password" autocomplete="off" placeholder="外部 Function 専用キー" />
  </details>

  <div class="row">
    <label for="voice">Voice</label>
    <select id="voice">
      <option value="alloy">alloy</option>
      <option value="verse">verse</option>
      <option value="sage">sage</option>
      <option value="ash">ash</option>
      <option value="coral" selected>coral</option>
    </select>
  </div>

  <div class="row">
    <label for="instructions">システム指示（任意）</label>
    <textarea id="instructions">日本語で簡潔かつ自然に回答してください。</textarea>
  </div>

  <div class="btns">
    <button id="startBtn">リアルタイム会話を開始</button>
    <button id="stopBtn" disabled>停止</button>
  </div>

  <div id="status">状態：未接続</div>
  <audio id="remoteAudio" autoplay playsinline controls></audio>
  <div id="events"></div>

  <script src="realtime-experiments.js"></script>
  <script>
    const access = RealtimeExperiments.createBrowserAccess({
      document, pageUrl: window.location.href, fetchImpl: (url, options) => fetch(url, options)
    });
    const statusEl = document.getElementById("status");
    const eventsEl = document.getElementById("events");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const remoteAudio = document.getElementById("remoteAudio");
    const voiceEl = document.getElementById("voice");
    const instructionsEl = document.getElementById("instructions");

    let pc = null;
    let localStream = null;
    let remoteStream = null;
    let dc = null;

    function setStatus(msg) {
      statusEl.textContent = `状態：${access.safe(msg)}`;
    }

    function log(msg, obj) {
      let line = `[${new Date().toLocaleTimeString()}] ${access.safe(msg)}`;
      if (obj !== undefined) {
        try {
          const safe = access.safe(obj);
          line += `\n${typeof safe === "string" ? safe : JSON.stringify(safe, null, 2)}`;
        } catch {
          line += "\n[表示できないイベント]";
        }
      }
      eventsEl.textContent += `${line}\n\n`;
      eventsEl.scrollTop = eventsEl.scrollHeight;
    }

    async function getEphemeralSession() {
      return access.getSession({
        transport: "webrtc", voice: voiceEl.value, instructions: instructionsEl.value
      });
    }

    async function start() {
      if (pc || startBtn.disabled) return;
      startBtn.disabled = true;
      try {
        setStatus("一時トークンを取得中...");
        const session = await getEphemeralSession();
        log("セッションを取得しました", session.info);

        setStatus("マイクの使用許可を確認中...");
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        setStatus("WebRTC 接続を確立中...");
        pc = new RTCPeerConnection();
        pc.onconnectionstatechange = () => setStatus(`WebRTC: ${pc.connectionState}`);
        pc.oniceconnectionstatechange = () => log("ICE の状態", pc.iceConnectionState);
        remoteStream = new MediaStream();
        remoteAudio.srcObject = remoteStream;
        remoteAudio.muted = false;
        remoteAudio.volume = 1;
        pc.ontrack = (event) => {
          log("リモート音声トラックを受信しました", {
            kind: event.track.kind,
            muted: event.track.muted,
            streams: event.streams.length
          });

          if (event.streams[0]) {
            remoteAudio.srcObject = event.streams[0];
          } else {
            remoteStream.addTrack(event.track);
          }

          const playAudio = async () => {
            try {
              await remoteAudio.play();
              log("リモート音声の再生を開始しました");
            } catch (err) {
              log("ブラウザーにより自動再生がブロックされました。音声コントロールの再生ボタンを選択してください", err?.message);
            }
          };

          event.track.addEventListener("unmute", playAudio, { once: true });
          void playAudio();
        };

        for (const track of localStream.getTracks()) {
          pc.addTrack(track, localStream);
        }

        dc = pc.createDataChannel("oai-events");
        dc.onerror = (event) => log("データチャネルでエラーが発生しました", event);
        dc.onclose = () => log("データチャネルが閉じられました");
        dc.onopen = () => {
          log("データチャネルが開きました");
          dc.send(JSON.stringify({
            type: "response.create",
            response: {
              instructions: "こんにちは。日本語で簡単に自己紹介してください。"
            }
          }));
        };
        dc.onmessage = (e) => {
          try {
            log("Realtime イベント", JSON.parse(e.data));
          } catch {
            log("Realtime の未処理メッセージ", e.data);
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        const sdpResp = await fetch(session.webrtcUrl, {
          method: "POST",
          redirect: "error",
          signal: AbortSignal.timeout(20000),
          headers: {
            "Authorization": `Bearer ${session.token}`,
            "Content-Type": "application/sdp"
          },
          body: offer.sdp
        });

        if (!sdpResp.ok) {
          throw new Error(`Realtime SDP HTTP ${sdpResp.status}: ${access.safe(await sdpResp.text())}`);
        }

        const answerSdp = await sdpResp.text();
        await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

        stopBtn.disabled = false;
        setStatus("接続しました。会話を開始できます");
      } catch (err) {
        log("開始に失敗しました", err?.message || String(err));
        setStatus("開始に失敗しました");
        await stop();
      } finally {
        startBtn.disabled = pc !== null;
      }
    }

    async function stop() {
      if (dc) {
        try { dc.close(); } catch {}
        dc = null;
      }
      if (pc) {
        try { pc.close(); } catch {}
        pc = null;
      }
      if (localStream) {
        for (const t of localStream.getTracks()) {
          t.stop();
        }
        localStream = null;
      }
      remoteAudio.srcObject = null;
      remoteStream = null;
      stopBtn.disabled = true;
      startBtn.disabled = false;
      setStatus("切断しました");
    }

    startBtn.addEventListener("click", start);
    stopBtn.addEventListener("click", () => { void stop(); });
  </script>
</body>
</html>
